name: MacOS Build

on:
  workflow_dispatch:
  
jobs:
  build-macos:
    name: Converseen macOS Build
    runs-on: macos-14

    env:
      BASE_DIR: ${{ github.workspace }}/im_build 
      WORKING_DIR: ${{ github.workspace }}

    steps:
    - name: Install dependencies
      run: |
        set -e
        
        export HOMEBREW_NO_AUTO_UPDATE=1
        brew install pkg-config freetype jpeg-turbo libheif libpng libtiff libtool libzip openexr openjpeg webp libraw ghostscript

    - name: Checkout Converseen
      uses: actions/checkout@v4
      with:
        repository: Faster3ck/Converseen
        path: Converseen

    - name: Download ImageMagick
      run: |
        wget https://imagemagick.org/archive/ImageMagick.tar.gz
        tar -xzvf ImageMagick.tar.gz
        
    - name: Build ImageMagick
      run: |
        cd ImageMagick-*

        export CFLAGS="-O2"
        export CXXFLAGS="-O2"
        export LDFLAGS="-Wl,-headerpad_max_install_names -Wl,-headerpad,0x2000"

        GS_PATH=$(brew --prefix ghostscript)

        export LDFLAGS="-L$GS_PATH/lib:$LDFLAGS"
        export CPPFLAGS="-I$GS_PATH/include"
        export PKG_CONFIG_PATH="$GS_PATH/lib/pkgconfig:$PKG_CONFIG_PATH"

        # Fix openmp compile error with libraw
        sed -i '' 's/-fopenmp//g' $(brew --prefix libraw)/lib/pkgconfig/libraw.pc
        sed -i '' 's/-fopenmp//g' $(brew --prefix libraw)/lib/pkgconfig/libraw_r.pc
        
        ./configure --prefix=${{ github.workspace }}/im_build \
                    --disable-silent-rules \
                    --disable-dependency-tracking \
                    --without-perl \
                    --disable-installed \
                    --with-quantum-depth=16 \
                    --disable-opencl \
                    --enable-shared \
                    --with-freetype=yes \
                    --with-gvc=no \
                    --with-openjp2 \
                    --with-openexr \
                    --with-webp=yes \
                    --with-heic=yes \
                    --with-raw=yes \
                    --with-zip=yes \
                    --with-gslib \
                    --with-gs-font-dir=/usr/local/share/ghostscript/fonts \
                    --without-djvu \
                    --without-fftw \
                    --without-pango \
                    --without-wmf \
                    --without-x \
                    --disable-openmp

        make
        make install

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        aqtversion: '==3.1.*'
        version: '6.10.*'
        host: 'mac'
        target: 'desktop'
        arch: 'clang_64'
      
    - name: Build Converseen
      run: |
        cd Converseen
        mkdir build
        cd build

        cmake \
         -DUSE_QT6=yes \
         -DCMAKE_BUILD_TYPE=Release \
         -DCMAKE_PREFIX_PATH="${{ github.workspace }}/im_build" \
         -DCMAKE_INSTALL_PREFIX=install ..
         
        make

    - name: Deploy Converseen
      run: |
        cd Converseen/build
        cmake --install .

    - name: Compress Converseen
      run: |
        cd Converseen/build/install
        zip -r --symlinks -9 converseen-beta_macos-x86_64.zip converseen.app
        pwd

    - name: Test Converseen
      run: | 
        cd Converseen/build/install
        ./converseen.app/Contents/MacOS/converseen -p

    - name: Compress Converseen
      run: |
        cd Converseen/build/install
        zip -r --symlinks -9 converseen-beta_macos-x86_64.zip converseen.app
        pwd

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ConverseenMacOSIntel
        path: Converseen/build/install/converseen-beta_macos-x86_64.zip

  create_release:
    name: 'Create Release'
    needs:
      - build-macos
    runs-on: macos-latest

    steps:
    - name: Checkout Converseen
      uses: actions/checkout@v4
      
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: ConverseenMacOSIntel

    - name: Extract artifact
      run: |
        unzip converseen-beta_macos-x86_64.zip

    - name: Test run
      run: |
        ./converseen.app/Contents/MacOS/converseen -p
        
      
