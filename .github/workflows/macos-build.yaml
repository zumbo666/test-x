name: MacOS Build

on:
  workflow_dispatch:
  
jobs:
  build-macos:
    name: Converseen macOS Build
    runs-on: macos-14

    env:
      BASE_DIR: ${{ github.workspace }}/im_build 
      WORKING_DIR: ${{ github.workspace }}

    steps:
    - name: Install dependencies
      run: |
        set -e
        
        export HOMEBREW_NO_AUTO_UPDATE=1
        brew install pkg-config freetype jpeg-turbo libheif libpng libtiff libtool libzip openexr openjpeg webp libraw ghostscript libomp glib libultrahdr imath llvm

    - name: Checkout Converseen
      uses: actions/checkout@v4
      with:
        path: Converseen

    - name: Download ImageMagick
      run: |
        wget https://imagemagick.org/archive/ImageMagick.tar.gz
        tar -xzvf ImageMagick.tar.gz
        # git clone https://github.com/ImageMagick/ImageMagick.git -b 7.1.2-12
        # cd ImageMagick
        # wget "https://gitlab.archlinux.org/archlinux/packaging/packages/imagemagick/-/raw/ca9b35f767e1c4a166847fbfe17c2d715aa80582/libraw-0.22.patch"
        # patch -p1 < libraw-0.22.patch
        
    - name: Build ImageMagick
      run: |
        cd ImageMagick-*

        export CPPFLAGS="-Xclang -fopenmp"
        export LDFLAGS="-lomp"

        # export CPPFLAGS="-Xpreprocessor -fopenmp -I/opt/homebrew/opt/libomp/include"
        # export LDFLAGS="-L/opt/homebrew/opt/libomp/lib -lomp -lz"
        
        export ac_cv_prog_c_openmp="-Xpreprocessor -fopenmp"
        export ac_cv_prog_cxx_openmp="-Xpreprocessor -fopenmp"

        ./configure --prefix=${{ github.workspace }}/im_build \
                    --disable-silent-rules \
                    --disable-opencl \
                    --enable-shared \
                    --enable-static \
                    --with-freetype=yes \
                    --with-rsvg=yes \
                    --with-gvc=no \
                    --with-openjp2 \
                    --with-openexr \
                    --with-webp=yes \
                    --with-heic=yes \
                    --with-raw=yes \
                    --with-uhdr=yes \
                    --with-zip=yes \
                    --with-gslib \
                    --with-gs-font-dir=/usr/local/share/ghostscript/fonts \
                    --with-lqr \
                    --without-djvu \
                    --without-fftw \
                    --without-pango \
                    --without-wmf \
                    --enable-openmp \
                    --without-x
                
        make
        make install

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        aqtversion: '==3.1.*'
        version: '6.10.*'
        host: 'mac'
        target: 'desktop'
        arch: 'clang_64'
      
    - name: Build Converseen
      run: |
        mkdir build
        cd build

        qmake ../converseen/converseen.pro -spec macx-clang IM_INSTALL_PREFIX=${{ github.workspace }}/im_build
        make

    - name: Copy Dependencies
      shell: python {0}
      run: |
        import os
        import shutil

        working_dir = os.environ['WORKING_DIR']
        os.chdir(working_dir + "/build/bin")

        print("Working dir:" + working_dir + "/build/bin")
        
        # Define the destination folder where symbolic links will be copied
        destination_folder = "converseen.app/Contents/Frameworks"
        os.mkdir(destination_folder)
        
        # Define the folders to scan
        folders_to_scan = [
            "/opt/homebrew/Cellar/aom",
            "/opt/homebrew/Cellar/brotli",
            "/opt/homebrew/Cellar/fontconfig",
            "/opt/homebrew/Cellar/freetype",
            "/opt/homebrew/Cellar/gettext",
            "/opt/homebrew/Cellar/ghostscript",
            "/opt/homebrew/Cellar/giflib",
            "/opt/homebrew/Cellar/highway",
            "/opt/homebrew/Cellar/imath",
            "/opt/homebrew/Cellar/jasper",
            "/opt/homebrew/Cellar/jbig2dec",
            "/opt/homebrew/Cellar/jpeg-turbo",
            "/opt/homebrew/Cellar/jpeg-xl",
            "/opt/homebrew/Cellar/libde265",
            "/opt/homebrew/Cellar/libheif",
            "/opt/homebrew/Cellar/libidn",
            "/opt/homebrew/Cellar/libomp",
            "/opt/homebrew/Cellar/libpng",
            "/opt/homebrew/Cellar/libraw",
            "/opt/homebrew/Cellar/libtiff",
            "/opt/homebrew/Cellar/libtool",
            "/opt/homebrew/Cellar/libvmaf",
            "/opt/homebrew/Cellar/little-cms2",
            "/opt/homebrew/Cellar/lz4",
            "/opt/homebrew/Cellar/openexr",
            "/opt/homebrew/Cellar/openjpeg",
            "/opt/homebrew/Cellar/pcre2",
            "/opt/homebrew/Cellar/webp",
            "/opt/homebrew/Cellar/x265",
            "/opt/homebrew/Cellar/xz",
            "/opt/homebrew/Cellar/zstd"
        ]
        
        # Function to find and copy symbolic links with a dylib extension
        def copy_dylib_from_folder(folder):
            try:
                if os.path.exists(folder):
                    for root, dirs, files in os.walk(folder):
                        for file in files:
                            if file.endswith(".dylib"): 
                                dylib_path = os.path.join(root, file)
                                dylib_name = os.path.basename(dylib_path)
                                if os.path.islink(os.path.join(root, file)):
                                    # Copy the symbolic link to the destination folder
                                    shutil.copy(dylib_path, os.path.join(destination_folder, dylib_name), follow_symlinks=False)
                                    print(f"Copied link {dylib_name} from {folder} to {destination_folder}")
                                else:
                                    # Copy library to the destination folder
                                    shutil.copy(dylib_path, os.path.join(destination_folder, dylib_name))
                                    print(f"Copied file {dylib_name} from {folder} to {destination_folder}")
                else:
                    print(f"The folder {folder} does not exist.")
            except Exception as e:
                print(f"An error occurred: {str(e)} while copying from {folder}")
        
        # Execute the function for each folder to scan
        for folder in folders_to_scan:
            copy_dylib_from_folder(folder)

    - name: Deploy Qt
      run: |
        cd build/bin
        sudo chmod -Rv a+rwx converseen.app/Contents/Frameworks/
        macdeployqt converseen.app -libpath=${{ github.workspace }}/im_build/lib

        # Fix libzip rpaths
        cd converseen.app/Contents/Frameworks/
        install_name_tool -change /usr/lib/libbz2.1.0.dylib @rpath/libbz2.1.0.dylib libzip.5.dylib
        install_name_tool -change @loader_path/../../../../opt/xz/lib/liblzma.5.dylib @rpath/liblzma.5.dylib libzip.5.dylib
        install_name_tool -change @loader_path/../../../../opt/zstd/lib/libzstd.1.dylib @rpath/libzstd.1.dylib libzip.5.dylib

    - name: Copy Resources
      run: |
        cd build/bin
        gs_ver=$(echo $(ls /opt/homebrew/Cellar/ghostscript/) | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
        
        echo "--- Copying res files ---"
        cp -RPv ${{ github.workspace }}/im_build/etc/ImageMagick-7 converseen.app/Contents/Resources
        cp -RPv /opt/homebrew/Cellar/ghostscript/$gs_ver/share/ghostscript converseen.app/Contents/Resources
        
        echo "--- Copying loc files ---"
        mkdir converseen.app/Contents/Resources/loc
        cp -RPv ../../converseen/loc/*.qm converseen.app/Contents/Resources/loc

        echo "--- Rename Ghostscript Resource Dir ---"
        cd converseen.app/Contents/Resources/ghostscript
        
        gs_ver_t=$(echo $(ls) | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
        mv $gs_ver_t gs

    - name: Compress Converseen
      run: |
        cd build/bin
        zip -r --symlinks -9 converseen-${{ env.VERSION }}-${{ env.BUILD }}_beta_macos-x86_64.zip converseen.app
        pwd

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ConverseenMacOSIntel
        path: build/bin/converseen-${{ env.VERSION }}-${{ env.BUILD }}_beta_macos-x86_64.zip
