name: Appimage (New)
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch: {}

jobs:
  build:
    name: "${{ matrix.name }} (${{ matrix.arch }})"
    runs-on: ${{ matrix.runs-on }}
    strategy:
      matrix:
        include:
          - runs-on: ubuntu-latest
            name: Build AppImage
            arch: x86_64
          - runs-on: ubuntu-24.04-arm
            name: Build AppImage
            arch: aarch64
    container:
      image: ghcr.io/pkgforge-dev/archlinux:latest
      options: --user 1000:1000
    steps:
      - name: Create builder user
        run: |
          echo "builder:x:1000:1000:Builder,,,:/home/builder:/bin/bash" >> /etc/passwd
          mkdir -p /home/builder
          chown -R 1000:1000 /home/builder $GITHUB_WORKSPACE

      - name: Test User
        run: |
          pwd
          ls
          whoami
