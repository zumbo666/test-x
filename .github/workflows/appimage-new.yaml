name: Appimage (New)
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch: {}

jobs:
  build:
    name: "${{ matrix.name }} (${{ matrix.arch }})"
    runs-on: ${{ matrix.runs-on }}
    strategy:
      matrix:
        include:
          - runs-on: ubuntu-latest
            name: Build AppImage
            arch: x86_64
          - runs-on: ubuntu-24.04-arm
            name: Build AppImage
            arch: aarch64
    container:
      image: ghcr.io/pkgforge-dev/archlinux:latest
    steps:
      - name: Create builder user
        run: |
          pacman -Sy --noconfirm shadow
          useradd -m -u 1000 -s /bin/bash builder
          chown -R builder:builder $GITHUB_WORKSPACE

      - name: Run as builder
        run: |
          su - builder
          pwd
          ls
          whoami

      - name: Checkout
        uses: actions/checkout@v4

      - name: Get dependencies
        run: |
          su - builder
          pwd
          ls
          whoami
          cd appimage
          chmod +x ./get-dependencies.sh && ./get-dependencies.sh

      - name: Install Custom ImageMagick
        run: |
          su - builder
          
          wget https://mirror.dogado.de/imagemagick/ImageMagick.tar.bz2
          tar -xvf ImageMagick.tar.bz2
          cd ImageMagick-*/
          ./configure --enable-shared --disable-installed --enable-hdri --without-perl --disable-dependency-tracking --with-gslib=yes --with-openjp2 --with-wmf --without-gvc --with-djvu --without-dps --without-fpx --with-heic=yes --with-rsvg --with-uhdr --with-fftw --with-lqr --without-autotrace --without-dps --without-fpx --without-gcc-arch --with-dejavu-font-dir=/usr/share/fonts/TTF --with-gs-font-dir=/usr/share/fonts/gsfonts --prefix=/usr --sysconfdir=/etc
          
          make -j$(nproc)
          sudo make install

      - name: Build Converseen
        run: |
          su - builder
          
          cd appimage/build
          makepkg -si --noconfirm

      - name: Make AppImage
        run: |
          su - builder
          cd appimage
          chmod +x ./*-appimage.sh && ./*-appimage.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: AppImage-${{ matrix.arch }}
          path: appimage/dist
